name: Real Windows KVM on Linux (80GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد المساحة والذاكرة على القرص الثانوي
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: إنشاء قرص صلب وهمي بسعة 80 جيجابايت على القرص D
      run: |
        # تخصيص مساحة 80GB بالكامل للقرص الوهمي
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G

    - name: تشغيل ويندوز عبر KVM مع تخصيص 2 نواة و 10 جيجابايت RAM
      run: |
        nohup kvm -smp 2 -m 10240 -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 -vnc :0 -enable-kvm > kvm.log 2>&1 &

    - name: تثبيت وتشغيل محول الويب و Cloudflare Tunnel
      run: |
        sudo apt-get install -y python3-pip python3-numpy python3-websockify git
        git clone https://github.com/novnc/noVNC.git
        
        nohup python3 ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > novnc.log 2>&1 &

        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        ./cloudflared tunnel --url http://localhost:6080 &
        
        sleep 15

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
