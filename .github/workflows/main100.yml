name: Real Windows KVM on Linux (10GB RAM, 80GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد المساحة والذاكرة على القرص الثانوي
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker python3-pip python3-dev git
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: إنشاء قرص صلب وهمي بسعة 80 جيجابايت على القرص D
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G

    - name: تثبيت أدوات الويب و websockify
      run: |
        pip3 install numpy websockify
        git clone https://github.com/novnc/noVNC.git

    - name: تشغيل ويندوز عبر KVM والانتظار لإقلاع الخادم
      run: |
        nohup qemu-system-x86_64 -smp 2 -m 10240 -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 -vnc :0 -enable-kvm > kvm.log 2>&1 &
        sleep 20

    - name: تشغيل جسر noVNC وتوجيه Cloudflare Tunnel
      run: |
        nohup python3 ./noVNC/utils/launch.py --listen 6080 --vnc localhost:5900 > novnc.log 2>&1 &
        
        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        nohup ./cloudflared tunnel --url http://localhost:6080 > cf.log 2>&1 &
        
        sleep 12
        cat cf.log

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
