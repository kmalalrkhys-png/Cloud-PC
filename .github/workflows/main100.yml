name: Real Windows KVM with Go-VNC (10GB RAM, 80GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-govnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص الثانوي ومساحة الـ 80GB
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker git golang-go
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص الويندوز الوهمي (80GB)
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G

    - name: تشغيل نظام KVM بالموارد المحددة
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -vnc :0 > kvm.log 2>&1 &
        
        sleep 20

    - name: تحميل وتثبيت خادم العرض البديل وتوجيه Cloudflare
      run: |
        # استنساخ أداة تعتمد على Go للبث السريع خفيف الموارد
        git clone https://github.com/maka00/govnc.git
        cd govnc
        go mod init govnc || true
        go get github.com/gorilla/websocket || true
        
        # تشغيل خادم البث عبر المنفذ 8080 لتجنب مشاكل 502
        nohup go run main.go socket > govnc.log 2>&1 &
        cd ..

        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        nohup ./cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
        
        sleep 12
        cat cf.log

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
