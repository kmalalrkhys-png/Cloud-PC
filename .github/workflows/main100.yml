name: Real Windows KVM on Linux (10GB RAM, 80GB Disk)

on:
  workflow_dispatch:

jobs:
  windows-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص الثانوي ومساحة الـ 80GB
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص الويندوز الوهمي (80GB)
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G

    - name: تشغيل محاكي KVM مع تخصيص 10GB رام و 2 Cores وتوجيه RDP
      run: |
        # ملاحظة: يمكنك وضع رابط ملف ISO لنظام ويندوز لتثبيته، أو تشغيل النظام المباشر
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -vnc :0 > kvm.log 2>&1 &
        
        sleep 10

    - name: تشغيل Cloudflare Tunnel لتوجيه منفذ RDP للاتصال المباشر
      run: |
        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        # توجيه بروتوكول RDP مباشرة عبر نفق TCP
        nohup ./cloudflared tunnel --url rdp://localhost:3389 > cf.log 2>&1 &
        
        sleep 12
        cat cf.log

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
