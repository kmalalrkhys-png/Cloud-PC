name: Real Windows KVM with Tailscale (10GB RAM, 100GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص الثانوي ومساحة الـ 100GB
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker python3-pip python3-venv git curl
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص الويندوز السريع (100GB) وتجهيز الواجهة
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 100G
        git clone https://github.com/novnc/noVNC.git
        ln -s vnc.html noVNC/index.html

    - name: تثبيت وتشغيل Tailscale واستخراج الآيبي التلقائي
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        
        sudo tailscaled &
        sleep 3
        
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-windows-kvm
        
        TS_IP=$(tailscale ip -4)
        echo "===================================================="
        echo "آيبي Tailscale الصحيح لهذا التشغيل هو: $TS_IP"
        echo "رابط الدخول المباشر:"
        echo "http://$TS_IP:6080/vnc.html?autoconnect=1&resize=scale"
        echo "===================================================="

    - name: تشغيل نظام KVM بأداء قرص سريع وجسر الويب
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio,cache=none,aio=native \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -vnc 0.0.0.0:0 > kvm.log 2>&1 &
        
        sleep 25
        
        python3 -m venv venv
        ./venv/bin/pip install websockify
        
        nohup ./venv/bin/websockify --web ./noVNC 0.0.0.0:6080 127.0.0.1:5900 > novnc.log 2>&1 &

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
