name: KVM Direct Port 3389

on:
  workflow_dispatch:

jobs:
  kvm-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص والأدوات
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker curl
        kvm-ok || true
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص 100GB
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 100G

    - name: تثبيت أداة PortForwarding لتوجيه المنفذ 3389
      run: |
        curl -L --output serveo https://github.com/anderspitman/tunnelto/releases/download/0.1.4/tunnelto-linux-amd64 || true
        # سنعتمد على تفعيل المنفذ المباشر عبر SSH/LocalTunnel أو خيار مباشر

    - name: تشغيل نظام KVM وتوجيه البورت 3389
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio,cache=none,aio=native \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -nographic > kvm.log 2>&1 &
        
        # استخدام LocalTunnel لتصدير البورت 3389 مباشرة بدون تعقيد
        sudo npm install -g localtunnel
        lt --port 3389 &

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
