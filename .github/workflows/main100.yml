name: Windows 11 25H2 KVM Direct Port 3389 (Arabic)

on:
  workflow_dispatch:

jobs:
  kvm-windows11-25h2:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص والأدوات
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker curl npm
        kvm-ok || true
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص 100GB سريع
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 100G

    - name: تحميل نسخة ويندوز 11 25H2 الرسمية (عربي)
      run: |
        echo "جاري تحميل نسخة ويندوز 11 إصدار 25H2 العربية..."
        curl -L -o win.iso "https://archive.org/download/Win11_25H2_Arabic_x64/Win11_25H2_Arabic_x64.iso"

    - name: تشغيل نظام KVM وربط البورت 3389
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 4 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio,cache=none,aio=native \
          -cdrom win.iso \
          -boot d \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -nographic > kvm.log 2>&1 &
        
        sudo npm install -g localtunnel
        
        echo "===================================================="
        echo "جاري تشغيل توجيه المنفذ 3389 لويندوز 11 (25H2)..."
        echo "===================================================="
        lt --port 3389 &

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
