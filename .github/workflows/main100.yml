name: Windows 11 25H2 Fast KVM RDP

on:
  workflow_dispatch:

jobs:
  kvm-win11:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص والأدوات
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker curl npm aria2
        kvm-ok || true
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص 100GB سريع
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 100G

    - name: تحميل نسخة ويندوز 11 الخام بأقصى سرعة
      run: |
        echo "جاري التحميل بأقصى سرعة عبر سيرفرات التوزيع السريعة..."
        # ضع رابط التحميل المباشر الحقيقي لملف الـ ISO بين القوسين أدناه
        aria2c -x 16 -s 16 -o win.iso "ضع_رابط_التحميل_المباشر_هنا"

    - name: تشغيل نظام KVM وربط البورت 3389
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 4 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio,cache=none,aio=native \
          -cdrom win.iso \
          -boot d \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -nographic > kvm.log 2>&1 &
        
        sudo npm install -g localtunnel
        
        echo "===================================================="
        echo "جاري تشغيل توجيه المنفذ 3389..."
        echo "===================================================="
        lt --port 3389 &

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
