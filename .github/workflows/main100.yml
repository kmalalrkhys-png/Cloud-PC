name: Real Windows KVM with Tailscale (10GB RAM, 80GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص الثانوي ومساحة الـ 80GB
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker python3-pip python3-venv git curl
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص الويندوز الوهمي (80GB) وتجهيز الواجهة
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G
        git clone https://github.com/novnc/noVNC.git
        ln -s vnc.html noVNC/index.html

    - name: تثبيت وتشغيل Tailscale تلقائياً
      run: |
        curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
        curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.src | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y tailscale
        
        sudo tailscaled &
        sleep 3
        # سحب المفتاح تلقائياً من إعدادات الـ Secrets بدون أن يطلب منك كود
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-windows-kvm

    - name: تشغيل نظام KVM وجسر الويب المحلي
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -vnc 0.0.0.0:0 > kvm.log 2>&1 &
        
        sleep 25
        
        python3 -m venv venv
        ./venv/bin/pip install websockify
        
        nohup ./venv/bin/websockify --web ./noVNC 6080 localhost:5900 > novnc.log 2>&1 &
        
        echo "===================================================="
        echo "تم التشغيل بنجاح عبر Tailscale تلقائياً!"
        echo "http://<Tailscale-IP>:6080/vnc.html?autoconnect=1&resize=scale"
        echo "===================================================="

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
