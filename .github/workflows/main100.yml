name: Real Windows KVM with Web VNC (10GB RAM, 80GB Disk)

on:
  workflow_dispatch:

jobs:
  kvm-webvnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: إعداد القرص الثانوي ومساحة الـ 80GB
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils cpu-checker python3-pip git
        kvm-ok || true
        
        sudo mkdir -p /mnt/d/kvm-disk
        sudo chown -R $USER:$USER /mnt/d/kvm-disk

    - name: بناء قرص الويندوز الوهمي (80GB) وتجهيز الواجهة
      run: |
        qemu-img create -f qcow2 /mnt/d/kvm-disk/win-hd.qcow2 80G
        
        # تحميل واجهة noVNC الرسمية والمستقرة
        git clone https://github.com/novnc/noVNC.git
        # إنشاء رابط مباشر لتوجيه الصفحة الرئيسية مباشرة إلى واجهة الاتصال vnc.html
        ln -s vnc.html noVNC/index.html

    - name: تشغيل نظام KVM وجسر الويب عبر websockify
      run: |
        nohup qemu-system-x86_64 \
          -enable-kvm \
          -smp 2 \
          -m 10240 \
          -drive file=/mnt/d/kvm-disk/win-hd.qcow2,format=qcow2,if=virtio \
          -net nic,model=virtio -net user,hostfwd=tcp::3389-:3389 \
          -vnc :0 > kvm.log 2>&1 &
        
        sleep 20
        
        # تثبيت وتشغيل websockify لخدمة ملفات الويب والربط بـ VNC على المنفذ 6080
        pip3 install websockify
        nohup websockify --web ./noVNC 6080 localhost:5900 > novnc.log 2>&1 &

    - name: تشغيل Cloudflare Tunnel لتوجيه الرابط
      run: |
        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        nohup ./cloudflared tunnel --url http://localhost:6080 > cf.log 2>&1 &
        
        sleep 12
        cat cf.log

    - name: إبقاء الجلسة نشطة
      run: |
        while true; do sleep 60; done
