name: Windows Web GUI (Cloudflare)

on:
  workflow_dispatch:

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: تثبيت خادم VNC السريع
      run: |
        choco install tightvnc -y
        # ضبط كلمة مرور صامتة لـ VNC لتجاوز شاشة التثبيت
        New-Item -Path "HKLM:\SOFTWARE\TightVNC\Server" -Force
        Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "Password" -Value ([byte[]](0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08))
        Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-reinstall", "-run"
        Start-Sleep -Seconds 3

    - name: إعداد محول الويب noVNC
      run: |
        git clone https://github.com/novnc/noVNC.git
        pip install numpy websockify
        Start-Process -NoNewWindow -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", ".\noVNC"

    - name: تشغيل نفق Cloudflare واستخراج الرابط
      run: |
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080" -RedirectStandardError "cf_log.txt" -NoNewWindow
        
        Start-Sleep -Seconds 12
        
        $url = Select-String -Path "cf_log.txt" -Pattern "https://[a-z0-9-]+\.trycloudflare\.com" | ForEach-Object { $_.Matches.Value }
        
        Write-Host "=========================================="
        Write-Host "✅ تم إنشاء الرابط بنجاح!"
        Write-Host "👉 الرابط هو: $($url)/vnc.html"
        Write-Host "=========================================="

    - name: إبقاء الجلسة نشطة
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
